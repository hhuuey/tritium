[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tritium"
version = "0.1.0"
description = "Road Structure Construction and Topology Generation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Huanghhdw", email = "your_email@example.com"},
]
keywords = ["road", "topology", "mapping", "geospatial", "GIS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy",
    "dbfread",
    "geopandas",
    "shapely",
    "pyproj",
    "dataclasses_json",
    "pydantic",
    "rasterio",
    "rtree",
    "opencv-python",
    "ortools==9.3.10497",
    "iso3166",
    "similaritymeasures"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "isort",
    "mypy",
]

# Foxglove/MCAP 可视化功能
visualization = [
    "foxglove-sdk",
    "mcap-protobuf-support",
    "foxglove-schemas-protobuf",
]
# 所有可选功能
all = [
    "foxglove-sdk",
    "mcap-protobuf-support",
    "foxglove-schemas-protobuf",
]

[project.urls]
Homepage = "https://github.com/huanghhdw/tritium"
Documentation = "https://github.com/huanghhdw/tritium"
Repository = "https://github.com/huanghhdw/tritium.git"
Issues = "https://github.com/huanghhdw/tritium/issues"

[project.scripts]
road-pipeline-vma = "project.road_structure.road_pipeline_vma:main"
road-pipeline-unimap = "project.road_structure.road_pipeline_unimap:main"
road-pipeline-huey = "project.road_structure.road_pipeline_huey:main"

[tool.setuptools]
packages = []

[tool.setuptools.find]
where = [".."]
include = ["cozy*", "project*"]

[tool.setuptools.package-data]
cozy = ["*.txt", "*.md", "**/*.txt", "**/*.md"]
project = ["*.txt", "*.md", "**/*.txt", "**/*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
