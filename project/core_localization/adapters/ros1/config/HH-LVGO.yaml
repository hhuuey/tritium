# 沿用上游 HH-LVGO 配置；相机参数由 launch 加载到 laserMapping 命名空间。
common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [-0.010986, -0.999937, 0.002338, -0.007770, -0.002253, -0.999967, 0.999909, -0.011004, -0.007745]
  Pcl: [-0.061281, 0.036577, -0.038252]
time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0
preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1
  scan_line: 6
  blind: 0.8
vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.05
  gyr_cov: 0.03
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  ba_bg_est_en: true
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
uav:
  imu_rate_odom: false
  gravity_align_en: false
publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
evo:
  seq_name: "Grass01"
  pose_output_en: true
pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
gps:
  gps_en: true
  debug_mode: false
  gps_time_offset: 0.0
  extrinsic_T: [0, 0, 0]
  gps_topic: "/ublox_driver/receiver_pvt"
opt:
  load_data: false
  rtk_cov: 0.01
  livo2_RPY_cov: 0.00000001
  livo2_XYZ_cov: 0.001
